<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Доменные списки и раздельные состояния сохранения и активации</title><desc id="desc">Продуктовая иллюстрация редактора. Файл, привязка, включение стратегии и работа службы различаются; фактический трафик не считается проверенным.</desc>
<defs>
 <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1119"/><stop offset="1" stop-color="#172633"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#22dbc2" stop-opacity=".23"/><stop offset="1" stop-color="#22dbc2" stop-opacity="0"/></radialGradient>
 <linearGradient id="surface" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#283c49"/><stop offset="1" stop-color="#15222e"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66f8d5"/><stop offset="1" stop-color="#0caeae"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#447080"/><stop offset="1" stop-color="#223646"/></linearGradient>
 <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#92d1d9" stroke-opacity=".045"/></pattern>
 <filter id="shadow" x="-35%" y="-40%" width="175%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000b13" flood-opacity=".65"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef8fa} .eyebrow{font-size:19px;font-weight:700;letter-spacing:3px;fill:#49e5cb}.title{font-size:53px;font-weight:750;letter-spacing:-1px}.body{font-size:25px;fill:#b4cbd4}.muted{fill:#8eaab9}.aqua{fill:#55ead1}.amber{fill:#f7c878}.mono{font-family:Consolas,monospace}.panel{fill:url(#surface);stroke:#3a5668;stroke-width:1.5}.line{fill:none;stroke:#3c6c7d;stroke-width:2}.caption{font-size:18px;fill:#90aebb}</style>
 </defs>
<rect width="1600" height="900" rx="28" fill="url(#canvas)"/><rect width="1600" height="900" rx="28" fill="url(#grid)"/>

<ellipse cx="1200" cy="450" rx="600" ry="450" fill="url(#halo)"/><text x="80" y="88" class="eyebrow">ДОМЕНЫ / ИСКЛЮЧЕНИЯ / СОСТОЯНИЯ</text><text x="78" y="163" class="title">Вы решаете, какой трафик обрабатывать</text><text x="80" y="217" class="body">Сохранённый список и активная стратегия — не одно и то же.</text>
<g filter="url(#shadow)"><rect x="80" y="288" width="780" height="476" rx="24" class="panel"/><rect x="80" y="288" width="780" height="78" rx="24" fill="#283d4a"/><text x="112" y="339" font-size="26" font-weight="700">Списки доменов</text><text x="815" y="337" text-anchor="end" font-size="18" class="muted">показаны 4 из 8</text>
<g transform="translate(108 389)"><rect width="724" height="65" rx="13" fill="#10232e"/><circle cx="26" cy="32" r="6" fill="#55e5c8"/><text x="48" y="41" font-size="23" font-weight="600">YouTube</text><text x="699" y="41" text-anchor="end" font-size="20" fill="#9fc4c9">Привязан к стратегии</text></g><g transform="translate(108 472)"><rect width="724" height="65" rx="13" fill="#10232e"/><circle cx="26" cy="32" r="6" fill="#55e5c8"/><text x="48" y="41" font-size="23" font-weight="600">Discord</text><text x="699" y="41" text-anchor="end" font-size="20" fill="#9fc4c9">Стратегия включена</text></g><g transform="translate(108 555)"><rect width="724" height="65" rx="13" fill="#10232e"/><circle cx="26" cy="32" r="6" fill="#f7c878"/><text x="48" y="41" font-size="23" font-weight="600">Свои домены</text><text x="699" y="41" text-anchor="end" font-size="20" fill="#f7c878">Список сохранён</text></g><g transform="translate(108 638)"><rect width="724" height="65" rx="13" fill="#10232e"/><circle cx="26" cy="32" r="6" fill="#55e5c8"/><text x="48" y="41" font-size="23" font-weight="600">Исключения</text><text x="699" y="41" text-anchor="end" font-size="20" fill="#9fc4c9">Не обрабатывать эти домены</text></g>
<rect x="906" y="288" width="614" height="476" rx="24" class="panel"/><text x="938" y="339" font-size="26" font-weight="700">Свои домены</text><text x="938" y="382" font-size="21" class="muted">Один домен — одна строка</text><rect x="938" y="404" width="550" height="178" rx="13" fill="#0b1823" stroke="#3a596b"/><g class="mono" font-size="24"><text x="964" y="448">example.org</text><text x="964" y="491">docs.example.net</text><text x="964" y="534">media.example.org</text></g>
<rect x="938" y="604" width="550" height="49" rx="12" fill="#133c3d"/><path d="m959 630 7 7 13-17" stroke="#66edca" stroke-width="3" fill="none"/><text x="993" y="636" class="aqua" font-size="21">Файл сохранён атомарно</text><text x="939" y="690" font-size="21" class="amber">Активация проверяется отдельно</text><text x="939" y="729" font-size="20" class="muted">При подборе — рестарт отложен</text></g>
<text x="80" y="824" font-size="22" class="muted">Файл → привязка → включение → служба. Обработка конкретного домена требует отдельной проверки.</text><text x="80" y="867" class="caption">Продуктовая иллюстрация · демонстрационные домены; не точная копия экрана LuCI</text>
</svg>
