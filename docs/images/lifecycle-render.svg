<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Запуск, остановка и восстановление службы</title><desc id="desc">Схема состояния: Stop снимает supervision и собственные правила, проверка подтверждает остановку, Start восстанавливает работу; чужая конфигурация сохраняется.</desc>
<defs>
 <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1119"/><stop offset="1" stop-color="#172633"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#22dbc2" stop-opacity=".23"/><stop offset="1" stop-color="#22dbc2" stop-opacity="0"/></radialGradient>
 <linearGradient id="surface" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#283c49"/><stop offset="1" stop-color="#15222e"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66f8d5"/><stop offset="1" stop-color="#0caeae"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#447080"/><stop offset="1" stop-color="#223646"/></linearGradient>
 <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#92d1d9" stroke-opacity=".045"/></pattern>
 <filter id="shadow" x="-35%" y="-40%" width="175%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000b13" flood-opacity=".65"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef8fa} .eyebrow{font-size:19px;font-weight:700;letter-spacing:3px;fill:#49e5cb}.title{font-size:53px;font-weight:750;letter-spacing:-1px}.body{font-size:25px;fill:#b4cbd4}.muted{fill:#8eaab9}.aqua{fill:#55ead1}.amber{fill:#f7c878}.mono{font-family:Consolas,monospace}.panel{fill:url(#surface);stroke:#3a5668;stroke-width:1.5}.line{fill:none;stroke:#3c6c7d;stroke-width:2}.caption{font-size:18px;fill:#90aebb}</style>
 </defs>
<rect width="1600" height="900" rx="28" fill="url(#canvas)"/><rect width="1600" height="900" rx="28" fill="url(#grid)"/>

<ellipse cx="795" cy="460" rx="750" ry="410" fill="url(#halo)"/><text x="80" y="88" class="eyebrow">LIFECYCLE / ДИАГНОСТИКА / ВОССТАНОВЛЕНИЕ</text><text x="78" y="163" class="title">Остановлена — значит остановлена</text><text x="80" y="217" class="body">Один владелец состояния. Без скрытого повторного запуска из LuCI.</text>
<g transform="translate(80 296)" filter="url(#shadow)"><rect width="408" height="374" rx="24" class="panel"/><circle cx="52" cy="53" r="8" fill="#f38b9e"/><text x="76" y="60" font-size="20" font-weight="700" fill="#f38b9e" letter-spacing="2">STOP</text><text x="30" y="121" font-size="31" font-weight="700">Остановить</text></g><g transform="translate(596 296)" filter="url(#shadow)"><rect width="408" height="374" rx="24" class="panel"/><circle cx="52" cy="53" r="8" fill="#55ead1"/><text x="76" y="60" font-size="20" font-weight="700" fill="#55ead1" letter-spacing="2">CHECK</text><text x="30" y="121" font-size="31" font-weight="700">Проверить</text></g><g transform="translate(1112 296)" filter="url(#shadow)"><rect width="408" height="374" rx="24" class="panel"/><circle cx="52" cy="53" r="8" fill="#64e3b0"/><text x="76" y="60" font-size="20" font-weight="700" fill="#64e3b0" letter-spacing="2">START</text><text x="30" y="121" font-size="31" font-weight="700">Запустить</text></g>
<g stroke="#47dac4" fill="none" stroke-width="3"><path d="M510 472H570m-12-11 12 11-12 11"/><path d="M1026 472H1086m-12-11 12 11-12 11"/></g>
<g font-size="23"><text x="110" y="468">Supervision снят</text><text x="110" y="516">Движки остановлены</text><text x="110" y="564">Свои правила удалены</text><text x="110" y="630" class="muted" font-size="20">Автозапуск не меняется</text>
<text x="626" y="468">Статус подтверждён</text><text x="626" y="516">Ошибки не скрываются</text><text x="626" y="564">LuCI не «воскрешает» службу</text><text x="626" y="630" class="muted" font-size="20">Чужие службы сохранены</text>
<text x="1142" y="468">Движки готовы</text><text x="1142" y="516">Свои правила возвращены</text><text x="1142" y="564">Настройки сохранены</text><text x="1142" y="630" class="muted" font-size="20">Результат проверяется</text></g>
<rect x="80" y="722" width="1440" height="88" rx="18" fill="#142b32" stroke="#315b68"/><text x="112" y="758" font-size="23" class="aqua">doctor · selftest · журнал событий</text><text x="112" y="791" font-size="22" class="muted">Для диагностики и восстановления — без слепого сброса пользовательской конфигурации.</text><text x="80" y="864" class="caption">Продуктовая схема поведения · не runtime-замер конкретного устройства</text>
</svg>
