<g font-size="23"><text x="86" y="525" class="aqua">01</text><text x="137" y="525">Домены и исключения</text><text x="86" y="579" class="aqua">02</text><text x="137" y="579">Проверки с понятным результатом</text><text x="86" y="633" class="aqua">03</text><text x="137" y="633">Контроль службы через LuCI</text></g>
