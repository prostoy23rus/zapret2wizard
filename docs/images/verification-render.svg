<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Как Zapret2Wizard проверяет стратегию</title><desc id="desc">Три этапа: кандидат, факты передачи, решение. Иллюстративный короткий ответ завершён, но контрольный образец недостаточен; playback остаётся неизвестным.</desc>
<defs>
 <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1119"/><stop offset="1" stop-color="#172633"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#22dbc2" stop-opacity=".23"/><stop offset="1" stop-color="#22dbc2" stop-opacity="0"/></radialGradient>
 <linearGradient id="surface" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#283c49"/><stop offset="1" stop-color="#15222e"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66f8d5"/><stop offset="1" stop-color="#0caeae"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#447080"/><stop offset="1" stop-color="#223646"/></linearGradient>
 <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#92d1d9" stroke-opacity=".045"/></pattern>
 <filter id="shadow" x="-35%" y="-40%" width="175%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000b13" flood-opacity=".65"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef8fa} .eyebrow{font-size:19px;font-weight:700;letter-spacing:3px;fill:#49e5cb}.title{font-size:53px;font-weight:750;letter-spacing:-1px}.body{font-size:25px;fill:#b4cbd4}.muted{fill:#8eaab9}.aqua{fill:#55ead1}.amber{fill:#f7c878}.mono{font-family:Consolas,monospace}.panel{fill:url(#surface);stroke:#3a5668;stroke-width:1.5}.line{fill:none;stroke:#3c6c7d;stroke-width:2}.caption{font-size:18px;fill:#90aebb}</style>
 </defs>
<rect width="1600" height="900" rx="28" fill="url(#canvas)"/><rect width="1600" height="900" rx="28" fill="url(#grid)"/>

<ellipse cx="800" cy="470" rx="650" ry="400" fill="url(#halo)"/>
<text x="80" y="88" class="eyebrow">ПОДБОР → ФАКТЫ → РЕШЕНИЕ</text><text x="78" y="163" class="title">Успех запроса — ещё не успех видео</text><text x="80" y="217" class="body">Полнота ответа и достаточность образца проверяются отдельно.</text>
<g transform="translate(80 296)" filter="url(#shadow)"><rect width="408" height="375" rx="24" class="panel"/><rect x="28" y="28" width="54" height="39" rx="10" fill="#23464f"/><text x="43" y="55" font-size="22" font-weight="700" class="aqua">01</text><text x="28" y="117" font-size="30" font-weight="700">Кандидат</text></g><g transform="translate(596 296)" filter="url(#shadow)"><rect width="408" height="375" rx="24" class="panel"/><rect x="28" y="28" width="54" height="39" rx="10" fill="#23464f"/><text x="43" y="55" font-size="22" font-weight="700" class="aqua">02</text><text x="28" y="117" font-size="30" font-weight="700">Передача</text></g><g transform="translate(1112 296)" filter="url(#shadow)"><rect width="408" height="375" rx="24" class="panel"/><rect x="28" y="28" width="54" height="39" rx="10" fill="#23464f"/><text x="43" y="55" font-size="22" font-weight="700" class="aqua">03</text><text x="28" y="117" font-size="30" font-weight="700">Решение</text></g>
<g stroke="#47dac4" fill="none" stroke-width="3"><path d="M510 472H570m-12-11 12 11-12 11"/><path d="M1026 472H1086m-12-11 12 11-12 11"/></g>
<text x="110" y="463" class="muted" font-size="22">Комбинация desync</text><rect x="109" y="487" width="349" height="80" rx="12" fill="#0c1b25"/><text x="129" y="519" class="mono aqua" font-size="18">--lua-desync=...</text><text x="129" y="548" class="mono muted" font-size="18">целевой сервис</text><text x="110" y="626" font-size="21" class="muted">Проверяется до принятия</text>
<text x="626" y="463" class="muted" font-size="22">Иллюстративный HTTP-ответ</text><text x="626" y="520" font-size="39" font-weight="700">200 <tspan class="muted" font-size="23">· 0.90 MiB</tspan></text><path d="M627 552H972" stroke="#253d4b" stroke-width="9" stroke-linecap="round"/><path d="M627 552H842" stroke="#5adac4" stroke-width="9" stroke-linecap="round"/><text x="626" y="600" class="aqua" font-size="21">Ответ завершён</text><text x="626" y="634" class="amber" font-size="21">Образец недостаточен</text>
<text x="1142" y="463" class="muted" font-size="22">Вывод по этой проверке</text><text x="1142" y="520" font-size="31" font-weight="700" class="amber">Не подтверждено</text><text x="1142" y="578" font-size="22" class="mono muted">playback: unknown</text><text x="1142" y="628" font-size="21" class="muted">Без обещаний «1080p / 4K»</text>
<rect x="80" y="721" width="1440" height="90" rx="18" fill="#122a31" stroke="#27646a"/><text x="112" y="758" font-size="22" class="aqua">Резервный узел не подменяет основной.</text><text x="112" y="790" font-size="22" class="muted">Ошибка curl, неизвестный объём и неполное тело остаются видимыми.</text><text x="80" y="861" class="caption">Схема проверки · пример данных; ограниченная HTTP-проба не измеряет ёмкость канала</text>
</svg>
