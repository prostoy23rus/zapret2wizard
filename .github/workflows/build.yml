name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/**"
      - "openwrt/**"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  scanner:
    name: scanner ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Только цели, для которых в stable есть готовый rust-std.
      # mips/mipsel/mips64/riscv64 собираются через `cross` (Docker) — см. docs/PACKAGING.md.
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            openwrt_arch: aarch64_cortex-a53
            engine: linux-arm64
          - target: armv7-unknown-linux-musleabihf
            openwrt_arch: arm_cortex-a7
            engine: linux-arm
          - target: x86_64-unknown-linux-musl
            openwrt_arch: x86_64
            engine: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build blockcheckw (musl)
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked"
          strip: true

      - name: Stage scanner
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/blockcheckw out/blockcheckw-${{ matrix.openwrt_arch }}
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: scanner-${{ matrix.openwrt_arch }}
          path: out/blockcheckw-${{ matrix.openwrt_arch }}
          retention-days: 14

  package:
    name: package ${{ matrix.openwrt_arch }}
    needs: scanner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_arch: aarch64_cortex-a53
            engine: linux-arm64
          - openwrt_arch: arm_cortex-a7
            engine: linux-arm
          - openwrt_arch: x86_64
            engine: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # actions/download-artifact@v4 падает целиком, если сервис артефактов
      # моргнул (так умер релиз 0.18.84: артефакт есть, скачивание — failure).
      # gh умеет то же самое, но мы можем повторить попытку.
      - name: Download scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh run download "$GITHUB_RUN_ID" -n "scanner-${{ matrix.openwrt_arch }}" -D out; then
              ls -l out
              exit 0
            fi
            echo "скачивание не удалось (попытка $i), пауза"
            sleep $((i * 10))
          done
          echo "::error::не удалось скачать scanner-${{ matrix.openwrt_arch }} за 3 попытки"
          exit 1

      - name: Build apk-tools (mkpkg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git zlib1g-dev libssl-dev libzstd-dev lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua5.3
          git clone -q --depth 1 --branch v3.0.5 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools && make -j"$(nproc)" >/tmp/apkbuild.log 2>&1 || true
          ls -l src/apk

      - name: Build bundle and apk
        env:
          LD_LIBRARY_PATH: /tmp/apk-tools/src
        run: |
          # dist/ хранится в репозитории, и пакеты прошлых версий уезжали
          # в релиз следующей (в v0.18.65 лежали файлы 0.18.64).
          rm -rf dist && mkdir -p dist
          python3 packaging/build.py \
            --repo . \
            --arch "${{ matrix.openwrt_arch }}" \
            --engine "openwrt/engine/nfqws2-${{ matrix.engine }}" \
            --scanner "out/blockcheckw-${{ matrix.openwrt_arch }}" \
            --out dist
          APK_BIN=/tmp/apk-tools/src/apk \
            sh packaging/build-apk.sh \
            --bundle "dist/zapret2wizard-$(python3 -c 'import json;print(json.load(open("openwrt/version.json"))["version"])')-${{ matrix.openwrt_arch }}-bundle.tar.gz" \
            --out dist

      - name: Build ipk (opkg)
        run: |
          # .ipk собирается штатным GNU ar: пакет нужен роутерам на opkg.
          bash packaging/build-ipk.sh \
            "${{ matrix.openwrt_arch }}" \
            "openwrt/engine/nfqws2-${{ matrix.engine }}" \
            "out/blockcheckw-${{ matrix.openwrt_arch }}" \
            dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.openwrt_arch }}
          path: dist/*
          retention-days: 14

  release:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
