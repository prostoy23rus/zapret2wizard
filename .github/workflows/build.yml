name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/**"
      - "openwrt/**"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  scanner:
    name: scanner ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Только цели, для которых в stable есть готовый rust-std.
      # mips/mipsel/mips64/riscv64 собираются через `cross` (Docker) — см. docs/PACKAGING.md.
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            openwrt_arch: aarch64_cortex-a53
            engine: linux-arm64
          - target: armv7-unknown-linux-musleabihf
            openwrt_arch: arm_cortex-a7
            engine: linux-arm
          - target: x86_64-unknown-linux-musl
            openwrt_arch: x86_64
            engine: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build blockcheckw (musl)
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked"
          strip: true

      - name: Stage scanner
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/blockcheckw out/blockcheckw-${{ matrix.openwrt_arch }}
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: scanner-${{ matrix.openwrt_arch }}
          path: out/blockcheckw-${{ matrix.openwrt_arch }}
          retention-days: 14

      # Установщик качает именно blockcheckw-linux-<arch>.tar.gz с релиза.
      # Без этого ассета он падал на апстрим и ставил старый сканер (v0.12.1).
      - name: Pack scanner tarball for installer
        run: |
          mkdir -p tarout
          cp target/${{ matrix.target }}/release/blockcheckw tarout/blockcheckw
          tar -czf "out/blockcheckw-${{ matrix.engine }}.tar.gz" -C tarout blockcheckw
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: scanner-tar-${{ matrix.engine }}
          path: out/blockcheckw-${{ matrix.engine }}.tar.gz
          retention-days: 14

  package:
    name: package ${{ matrix.openwrt_arch }}
    needs: scanner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_arch: aarch64_cortex-a53
            engine: linux-arm64
          - openwrt_arch: arm_cortex-a7
            engine: linux-arm
          - openwrt_arch: x86_64
            engine: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # actions/download-artifact@v4 падает целиком, если сервис артефактов
      # моргнул (так умер релиз 0.18.84: артефакт есть, скачивание — failure).
      # gh умеет то же самое, но мы можем повторить попытку.
      - name: Download scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh run download "$GITHUB_RUN_ID" -n "scanner-${{ matrix.openwrt_arch }}" -D out; then
              ls -l out
              exit 0
            fi
            echo "скачивание не удалось (попытка $i), пауза"
            sleep $((i * 10))
          done
          echo "::error::не удалось скачать scanner-${{ matrix.openwrt_arch }} за 3 попытки"
          exit 1

      - name: Build apk-tools (mkpkg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential zlib1g-dev libssl-dev libzstd-dev lua5.4
          # Avoid git-clone 403s seen on runners; codeload tarball is equivalent.
          rm -rf /tmp/apk-tools-src /tmp/apk-tools /tmp/apk-tools.tar.gz
          ok=0
          for url in \
            "https://codeload.github.com/alpinelinux/apk-tools/tar.gz/refs/tags/v3.0.5" \
            "https://gitlab.alpinelinux.org/alpine/apk-tools/-/archive/v3.0.5/apk-tools-v3.0.5.tar.gz"; do
            if curl -LfsS -m 120 -o /tmp/apk-tools.tar.gz "$url"; then ok=1; break; fi
            echo "fetch failed: $url"
          done
          [ "$ok" = 1 ]
          mkdir -p /tmp/apk-tools-src
          tar -xzf /tmp/apk-tools.tar.gz -C /tmp/apk-tools-src
          APKDIR=$(find /tmp/apk-tools-src -maxdepth 1 -mindepth 1 -type d | head -1)
          ln -s "$APKDIR" /tmp/apk-tools
          cd /tmp/apk-tools
          # The 3.0.5 index applet reads only v2 package metadata; our mkpkg
          # packages are v3, so let index read v3 metadata (APKINDEX format
          # is unchanged). Used only by the feed job.
          sed -i "s/apk_pkg_read(db, arg, \&pkg, false)/apk_pkg_read(db, arg, \&pkg, true)/" src/app_index.c
          grep -n "apk_pkg_read(db, arg" src/app_index.c
          make -j"$(nproc)" LUA=lua5.4 LUAAPK=no
          ls -l src/apk

      - name: Pack apk-tools for feed index
        if: matrix.openwrt_arch == 'aarch64_cortex-a53'
        run: |
          cd /tmp/apk-tools/src
          files="apk"
          for f in libapk.so*; do [ -e "$f" ] && files="$files $f"; done
          tar -czf /tmp/apk-tools-bin.tar.gz $files

      - name: Upload apk-tools for feed
        if: matrix.openwrt_arch == 'aarch64_cortex-a53'
        uses: actions/upload-artifact@v4
        with:
          name: apk-tools-bin
          path: /tmp/apk-tools-bin.tar.gz
          retention-days: 14

      - name: Build bundle and apk
        env:
          LD_LIBRARY_PATH: /tmp/apk-tools/src
          PKG_RELEASE: "3"
        run: |
          # dist/ хранится в репозитории, и пакеты прошлых версий уезжали
          # в релиз следующей (в v0.18.65 лежали файлы 0.18.64).
          rm -rf dist && mkdir -p dist
          python3 packaging/build.py \
            --repo . \
            --arch "${{ matrix.openwrt_arch }}" \
            --engine "openwrt/engine/nfqws2-${{ matrix.engine }}" \
            --scanner "out/blockcheckw-${{ matrix.openwrt_arch }}" \
            --out dist
          APK_BIN=/tmp/apk-tools/src/apk \
            sh packaging/build-apk.sh \
            --bundle "dist/zapret2wizard-$(python3 -c 'import json;print(json.load(open("openwrt/version.json"))["version"])')-${{ matrix.openwrt_arch }}-bundle.tar.gz" \
            --out dist

      - name: Build ipk (opkg)
        run: |
          # .ipk собирается штатным GNU ar: пакет нужен роутерам на opkg.
          bash packaging/build-ipk.sh \
            "${{ matrix.openwrt_arch }}" \
            "openwrt/engine/nfqws2-${{ matrix.engine }}" \
            "out/blockcheckw-${{ matrix.openwrt_arch }}" \
            dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.openwrt_arch }}
          path: |
            dist/*.apk
            dist/*.ipk
            dist/*-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  feed:
    name: publish repo feed
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: apk-tools-bin
          path: apk-bin

      - name: Install OpenWrt host apk (for signed packages.adb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -LfsS -m 300 -o /tmp/ib.tar.zst "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64.tar.zst"
          echo "a792e29bd2233cda67a0823030bfb53c0b61fbb3836b2063e88adf89730d563b  /tmp/ib.tar.zst" | sha256sum -c -
          mkdir -p /tmp/ib host-apk
          zstd -dc /tmp/ib.tar.zst | tar -xf - -C /tmp/ib --wildcards "*/staging_dir/host/bin/*" "*/staging_dir/host/lib/*"
          ROOT=$(find /tmp/ib -maxdepth 1 -type d | tail -1)
          mkdir -p host-apk/staging_dir
          cp -a "$ROOT/staging_dir/host" host-apk/staging_dir/
          host-apk/staging_dir/host/bin/apk --version

      - name: Generate feed (opkg Packages + apk APKINDEX/packages.adb)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/apk-bin
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          tar -xzf apk-bin/apk-tools-bin.tar.gz -C apk-bin
          chmod +x apk-bin/apk
          ./apk-bin/apk --version
          SIGN_ARGS=""
          if [ -n "$APK_SIGN_KEY" ]; then
            echo "Signing key present: packages.adb will be signed"
            printf '%s' "$APK_SIGN_KEY" > "$RUNNER_TEMP/apk-sign.key"
            chmod 600 "$RUNNER_TEMP/apk-sign.key"
            SIGN_ARGS="--apk-host $PWD/host-apk/staging_dir/host/bin/apk --apk-sign-key $RUNNER_TEMP/apk-sign.key --apk-sign-pub release-keys/zapret2wizard-apk.pem"
          else
            echo "::warning::APK_SIGN_KEY is not set; feed will be unsigned (--allow-untrusted required)"
          fi
          python3 packaging/build-feed.py \
            --dist dist --out feed \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/feed" \
            --tag "${GITHUB_REF_NAME}" \
            --apk-tools "$PWD/apk-bin/apk" \
            $SIGN_ARGS


      - name: Publish feed branch
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd feed
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "feed: ${GITHUB_REF_NAME}"
          git branch -M feed
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin feed

  release:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select release notes
        id: release-notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          notes="release_${RELEASE_TAG#v}.md"
          if [ "$EVENT_NAME" = release ]; then
            # A published release already owns its hand-edited body. Attach assets only.
            echo "generate=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$notes" ]; then
            echo "body_path=$notes" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release artifact directory
        run: rm -rf dist && mkdir -p dist
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: scanner-tar-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        run: |
          cd dist
          files=( *.apk *.ipk *-bundle.tar.gz blockcheckw-linux-*.tar.gz )
          for file in "${files[@]}"; do test -f "$file"; done
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.ipk
            dist/*-bundle.tar.gz
            dist/blockcheckw-linux-*.tar.gz
            dist/SHA256SUMS
          body_path: ${{ steps.release-notes.outputs.body_path }}
          generate_release_notes: ${{ steps.release-notes.outputs.generate }}
          fail_on_unmatched_files: true
