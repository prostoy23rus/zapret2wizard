name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Линтим оба пути: дефолтный (stderr-only, как в release-сборках router-
      # таргетов) и --features otel (OTLP-стек tonic/tower, см. Cargo.toml).
      - run: cargo clippy -- -D warnings
      - run: cargo clippy --features otel -- -D warnings
      - run: cargo test --lib --bins --features otel
      # Тесты, которым не нужен ни root, ни живой движок, — им место здесь, а не в
      # привилегированной джобе ниже. `orphan_reaping` сторожит PDEATHSIG: без него
      # сторож не взводится нигде и отчитывается зелёным по построению.
      - run: cargo test --test orphan_reaping
      # Снятие фоновых процессов необратимо для всего процесса, поэтому живёт отдельным
      # бинарём: среди юнит-тестов оно убивало чужих детей (`nfqws2::run`).
      - run: cargo test --test background_shutdown

  # Скрипты OpenWrt (helper, init, uci2config) живут вне rust-тестов, но это
  # такой же код пакета: проверяем синтаксис busybox ash и гоняем shell-тесты
  # из tools/. Route-тест ставит nft-правила в отдельный netns, поэтому нужен
  # root — на раннере он есть через sudo.
  openwrt-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static nftables

      - name: Syntax check (busybox ash)
        run: |
          for f in openwrt/luci-app-blockcheckw/root/usr/bin/blockcheckw-helper \
                   openwrt/luci-app-blockcheckw/root/etc/init.d/zapret2wizard \
                   openwrt/luci-app-blockcheckw/root/usr/share/zapret2wizard/uci2config; do
            printf '%s: ' "$f"
            busybox ash -n "$f" && echo OK
          done

      - name: Helper unit tests
        run: |
          sh tools/test_quic_mode.sh
          sh tools/test_netcheck.sh

      - name: Route engine (netns)
        run: sudo unshare -n sh tools/test_route_engine.sh

  # Экзотические цели собираются ТОЛЬКО в релизном воркфлоу, поэтому их поломка
  # всплывала уже после нарезки тега: v0.11.0 потерял mips, mipsel и ppc на
  # `AtomicU64` в зависимости — при зелёном CI на самом PR. Здесь они проверяются
  # до мерджа.
  #
  # `check`, а не `build --release`: ловим типы, которых на цели нет, не платя за
  # кодоген, UPX и линковку. C-компилятор всё равно нужен — build-скрипт
  # `aws-lc-sys` (приезжает через `rustls`) компилирует C безусловно, поэтому идём
  # через cross, а не голым cargo.
  #
  # mips и mipsel — представители класса «32 бита, нет 64-битных атомиков», оба
  # порядка байтов. ppc из того же класса, но образа cross для него нет, а качать
  # musl-cross на каждый PR дорого: по исходной совместимости он совпадает с mips.
  check-exotic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [mips-unknown-linux-musl, mipsel-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - run: cross +nightly check --release --target ${{ matrix.target }} -Zbuild-std=std,panic_abort

  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Load kernel modules
        run: |
          sudo modprobe nfnetlink_queue
          sudo modprobe nf_tables
          sudo modprobe nft_queue

      - name: Build integration image
        run: docker build -f docker/integration.Dockerfile -t blockcheckw-integration .

      - name: Run e2e_infra tests
        run: docker run --rm --privileged blockcheckw-integration --test e2e_infra -- --nocapture

      - name: Run parallel_benchmark tests
        continue-on-error: true
        run: docker run --rm --privileged blockcheckw-integration --test parallel_benchmark -- --nocapture
